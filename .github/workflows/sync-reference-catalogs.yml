name: Sync reference catalogs (FMM + Perminov + upstream scheme repos + LITA)

# Refreshes the external reference-rank digests we compare against, via
# eu.solven.matmul.docs.verify.SyncReferenceCatalogs (mvn exec:java):
#   * references/catalogs/fmm-lille-catalog.json   (--fmm)
#   * references/catalogs/perminov-catalog.json    (--perminov)
# and imports the new scheme files (factor matrices) of the upstream repos that
# publish them in a format we read directly:
#   * dronperminov/FastMatrixMultiplication  schemes/results/*   (ImportPerminovSchemes)
#   * every repo of UpstreamSchemeRepos — MerlijnW70/fmm-schemes, matyasstoch/cloudroom-math
#                                                                (ImportUpstreamSchemeRepos)
#   * khoruzhii/lita                         schemes/*.npz       (ImportKhoruzhiiLita --download)
#
# These drive the 3-catalog comparison + `solven_discovery` flag in
# GenerateCatalogManifest (a result we beat both FMM and Perminov on). The flag
# is provisional: when FMM/Perminov publish an equal-or-better rank, the next
# sync + regenerate drops it. Committing a digest change triggers
# regenerate-catalog.yml (which watches both digest paths) to recompute the
# manifest.
#
# Manual: `gh workflow run sync-reference-catalogs.yml`
on:
  schedule:
    - cron: '0 */3 * * *'      # every 3h — Perminov/FMM publish regularly, so we
                               # re-sync promptly; regenerate-catalog watches the
                               # digest paths and recomputes the manifest on change.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-reference-catalogs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile
        run: mvn -B -ntp -q compile

      - name: Refresh Perminov digest
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=eu.solven.matmul.docs.verify.SyncReferenceCatalogs \
            -Dexec.args="--perminov"

      - name: Refresh FMM-Lille digest
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=eu.solven.matmul.docs.verify.SyncReferenceCatalogs \
            -Dexec.args="--fmm" \
            || echo "FMM scrape failed (site may be down); keeping existing digest"

      # The digest above only refreshes the per-format RANK index; the actual scheme
      # factor matrices must be imported too, or the catalog keeps STALE schemes while
      # the digest advertises better ranks (the 186-shape ≤16 gap: digest ⟨13,15,16⟩=1885
      # but the imported scheme was 1908). This is the Java port of the removed
      # tools/import_dronperminov.py — it imports any NEW or strictly-better upstream scheme.
      - name: Import Perminov schemes (factor matrices)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # authenticated tree listing (rate limit)
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=eu.solven.matmul.docs.migrate.ImportPerminovSchemes \
            -Dexec.args="--max-dim=32" \
            || echo "Perminov scheme import failed (GitHub API / rate-limit); keeping existing schemes"

      # Third-party scheme repositories (UpstreamSchemeRepos: Witteveen's dataset, the
      # Cloudroom Math campaign, …) are cited by FMM-Lille and mirrored by Perminov under
      # schemes/known/<sub>/ — subtrees the step above does not list (it only pulls
      # Perminov's own schemes/results/*). Witteveen's release 1.0 (new best over every ring
      # at ⟨11,13,15⟩ and ⟨11,14,14⟩) sat un-imported for six days; this pulls from the
      # ORIGIN repos, which are also ahead of their mirrors. New files go through the
      # contributed-scheme gate (exact proof + spot-check + mod-p + disk round-trip);
      # `discovery` is stamped "TBD" for a human to audit (RestampContributedProvenance).
      - name: Import upstream scheme repos (UpstreamSchemeRepos registry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: -Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=target/oom-dumps/
        run: |
          mkdir -p target/oom-dumps
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=eu.solven.matmul.docs.migrate.ImportUpstreamSchemeRepos \
            || echo "upstream scheme repo import failed (GitHub API / rate-limit); keeping existing schemes"

      # The KGP LITA cubes (khoruzhii/lita): a new rank is a new {N}x{N}x{N}_r{R}.npz
      # upstream; archives we do not vendor are fetched, gated (exact where the term count
      # fits, spot-check tier above) and registered as TA_lita_npz(n=N,r=R) stubs.
      - name: Import new LITA archives (khoruzhii/lita)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: -Xmx6g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=target/oom-dumps/
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=eu.solven.matmul.docs.migrate.ImportKhoruzhiiLita \
            -Dexec.args="--download --execute" \
            || echo "LITA archive import failed (GitHub API / rate-limit); keeping existing archives"

      # Regenerate when schemes changed — counting BOTH modified-tracked AND untracked-new
      # files. `git diff --quiet` alone misses brand-new files, so an import that adds ONLY
      # new schemes (no modifications) silently skipped this and committed a STALE
      # docs/catalog.json that lacked the freshly-imported schemes.
      - name: Regenerate catalog manifest if schemes changed
        run: |
          if ! git diff --quiet -- src/main/resources/schemes \
             || [ -n "$(git ls-files --others --exclude-standard -- src/main/resources/schemes)" ]; then
            mvn -B -ntp -q exec:java \
              -Dexec.mainClass=eu.solven.matmul.docs.generate.GenerateCatalogManifest
          else
            echo "no scheme changes → manifest unchanged"
          fi

      # Field-claim gate BEFORE committing. This job commits with [skip ci], so
      # the standalone verify-catalog.yml gate never fires on its commit — the
      # only place a freshly-imported / regenerated over-claim (e.g. a 1/8
      # coefficient mis-tagged Z/F2) can be caught is HERE, before the push.
      # Fails the job (no commit) rather than silently shipping bad field tags.
      - name: Verify field claims (lineage + coefficients, no dense)
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=eu.solven.matmul.docs.VerifySchemes \
            -Dexec.args="--check=lineage,coefficients"

      - name: Commit digest + imported schemes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add references/catalogs/perminov-catalog.json references/catalogs/fmm-lille-catalog.json \
                  src/main/resources/schemes src/main/resources/external/khoruzhii-lita docs/catalog.json
          if git diff --cached --quiet; then
            echo "No reference-catalog or scheme changes."
          else
            git commit -m "Sync reference catalogs + import upstream schemes [skip ci]"
            git push
          fi
