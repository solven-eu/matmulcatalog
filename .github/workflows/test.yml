name: Tests

# Runs the JUnit test suite on every push to master and every PR.
# Heavy tests (SAT enumerations, multi-shape strategy surveys) are tagged
# in the source so they can be skipped via -DexcludedGroups=slow once
# tagging is in place; for now the full suite runs.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile
        run: mvn -B -ntp -q compile test-compile

      - name: Run tests (excluding catalog-iterating + benchmark)
        run: mvn -B -ntp test -Dsurefire.useFile=false

      - name: Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  catalog-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run catalog-iterating tests; these scale with catalog size and are
    # too slow for every-push runs. Triggers: master push only (post-merge),
    # plus manual dispatch and the weekly cron.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile
        run: mvn -B -ntp -q compile test-compile

      - name: Run catalog-iterating tests
        run: >
          mvn -B -ntp test -Dsurefire.useFile=false
          -Dgroups=catalog-iterating
          -DexcludedGroups=benchmark

      - name: Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports-catalog
          path: target/surefire-reports/
          retention-days: 7
